name: bootstrap-cto-pack
on:
  push:
    paths:
      - '.github/workflows/bootstrap-cto-pack.yml'
      - '.cto-bootstrap/**'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack CTO pack
        shell: bash
        run: |
          set -euo pipefail
          cat .cto-bootstrap/payload.* > /tmp/cto.b64
          base64 -d /tmp/cto.b64 > /tmp/cto.tar.xz
          xz -t /tmp/cto.tar.xz
          tar -xJf /tmp/cto.tar.xz -C .
          rm -rf .cto-bootstrap
          rm -f .github/workflows/bootstrap-cto-pack.yml
      - name: Commit CTO pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SYNERGY Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: publish institutional CTO package"
          git push origin HEAD:main
